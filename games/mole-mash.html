<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Mole Mash - Whack the moles before they hide">
    <title>Mole Mash - WesleyDude.com</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="mole-mash.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <nav class="nav">
            <div class="nav-brand">
                <h1><a href="../index.html" style="text-decoration: none; color: inherit;">WesleyDude.com</a></h1>
            </div>
            <ul class="nav-links">
                <li><a href="../index.html">Home</a></li>
                <li><a href="../index.html#lie-detector">Lie Detector</a></li>
                <li><a href="index.html" class="active">Games</a></li>
            </ul>
            <button class="nav-toggle" aria-label="Toggle navigation">
                <span></span><span></span><span></span>
            </button>
        </nav>
    </header>

    <main class="game-main">
        <div class="game-container">
            <div class="game-header">
                <div class="game-title">
                    <h1>🐹 Mole Mash</h1>
                    <p>Whack moles before they dive back underground!</p>
                </div>
                <div class="game-stats">
                    <div class="stat"><span class="stat-label">Score</span><span class="stat-value" id="score">0</span></div>
                    <div class="stat"><span class="stat-label">Time</span><span class="stat-value" id="time">30</span></div>
                    <div class="stat"><span class="stat-label">High</span><span class="stat-value" id="high">0</span></div>
                </div>
            </div>

            <div class="mole-grid" id="moleGrid"></div>

            <div class="game-controls">
                <button class="btn btn-primary" id="startBtn">Start</button>
                <button class="btn btn-outline" id="backBtn">Back to Games</button>
            </div>
            <div class="game-messages" id="gameMessages"></div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 WesleyDude.com. Built with ❤️ by Wesley.</p>
        </div>
    </footer>

    <script src="../script.js"></script>
    <script src="mole-mash.js"></script>
</body>
</html>
