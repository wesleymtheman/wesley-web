<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Educational games by Wesley - learn while you play">
    <title>Educational Games - WesleyDude.com</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="games.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <nav class="nav">
            <div class="nav-brand">
                <h1><a href="../index.html">WesleyDude.com</a></h1>
            </div>
            <ul class="nav-links">
                <li><a href="../index.html">Home</a></li>
                <li><a href="../index.html#about">About</a></li>
                <li><a href="index.html">Games</a></li>
                <li><a href="educational.html" class="active">Educational</a></li>
                <li><a href="../question.html">?</a></li>
            </ul>
            <button class="nav-toggle" aria-label="Toggle navigation">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </nav>
    </header>

    <main>
        <section class="games-hero educational-hero">
            <div class="container">
                <div class="games-hero-content">
                    <h1 class="games-title">Educational Games</h1>
                    <p class="games-subtitle">Pick your grade — higher grades make the educational games harder.</p>
                    <p class="games-daily">New educational games coming soon!</p>
                    <div class="grade-picker">
                        <label for="gradeSelectHome">What grade are you in?</label>
                        <select id="gradeSelectHome" aria-label="What grade are you in?">
                            <option value="">Pick your grade</option>
                            <option value="K">Kindergarten</option>
                            <option value="1">1st Grade</option>
                            <option value="2">2nd Grade</option>
                            <option value="3">3rd Grade</option>
                            <option value="4">4th Grade</option>
                            <option value="5">5th Grade</option>
                        </select>
                        <p class="grade-saved" id="gradeSavedMsg"></p>
                    </div>
                    <button class="btn btn-primary" id="randomEduBtn" type="button">Play a Random Educational Game</button>
                </div>
            </div>
        </section>

        <section class="games-grid">
            <div class="container">
                <div class="games-container" id="eduGamesContainer"></div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 WesleyDude.com. Built with ❤️ by Wesley.</p>
        </div>
    </footer>

    <script src="../script.js"></script>
    <script src="educational.js"></script>
</body>
</html>
