<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="styles.css?v=5">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <nav class="nav">
            <div class="nav-brand">
                <h1><a href="index.html" style="text-decoration:none;color:inherit;">WesleyDude.com</a></h1>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>

                <li><a href="index.html#lie-detector">Lie Detector</a></li>

                <li><a href="games/educational.html">Educational</a></li>

            </ul>
            <button class="nav-toggle" aria-label="Toggle navigation">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </nav>
    </header>

    <main class="question-main">
        <div class="question-stage">
            <button type="button" class="question-trigger" id="questionTrigger" aria-label="Click the question mark">
                ?
            </button>
            <div class="question-reveal" id="questionReveal" hidden>
                <img src="funny-doll.jpg" alt="A funny doll" class="question-doll" id="dollPic">
                <p class="question-caption">…okay then.</p>
                <button type="button" class="btn btn-secondary" id="hideDollBtn">Hide it. Please.</button>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 WesleyDude.com. Built with ❤️ by Wesley.</p>
        </div>
    </footer>

    <script src="script.js?v=4"></script>
    <script>
        (function () {
            const trigger = document.getElementById('questionTrigger');
            const reveal = document.getElementById('questionReveal');
            const hideBtn = document.getElementById('hideDollBtn');
            const doll = document.getElementById('dollPic');

            function showDoll() {
                trigger.hidden = true;
                reveal.hidden = false;
                reveal.classList.add('pop');
                doll.classList.remove('shake');
                void doll.offsetWidth;
                doll.classList.add('shake');
            }

            function hideDoll() {
                reveal.hidden = true;
                reveal.classList.remove('pop');
                trigger.hidden = false;
            }

            trigger.addEventListener('click', showDoll);
            hideBtn.addEventListener('click', hideDoll);
        })();
    </script>
</body>
</html>
